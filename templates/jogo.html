
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Stadium do Coffee - Partida de futebol de botão">
    <meta name="theme-color" content="#07140f">

    <title>Partida | Stadium do Coffee</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='jogo.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='paginas.css') }}">
</head>

<body>

    <header>
        <h1>Stadium do Coffee</h1>
        <p>Button Football Championship</p>
    </header>

    <main>

        <nav class="navegacao-paginas">
            <a href="{{ url_for('inicio') }}" class="link-voltar">
                ← Voltar ao início
            </a>
        </nav>

        <section class="titulo-pagina">
            <span class="etiqueta-pagina">CAMPEONATO</span>
            <h2>Partida em andamento</h2>
            <p>Prepare sua estratégia e conquiste a vitória!</p>
        </section>

        <!-- PLACAR -->
        <section class="placar" aria-label="Placar da partida">

            <div class="time vermelho">
                <h2 id="nomeVermelho">Jogador vermelho</h2>
                <span id="gols1" aria-label="Gols do time vermelho">0</span>
            </div>

            <div class="centro">
                <h2 id="tempo" aria-label="Tempo de partida">05:00</h2>
                <p id="turno">Vez de Marcos 🔴</p>
            </div>

            <div class="time azul">
                <h2 id="nomeAzul">Jogador azul</h2>
                <span id="gols2" aria-label="Gols do time azul">0</span>
            </div>

        </section>

        <!-- IMAGEM DO CAMPO/ARTE ENVIADA -->
        <section class="campo-imagem" aria-label="Imagem personalizada da partida">
            <img src="{{ url_for('static', filename='nao_de_nem_agua.png') }}"
                 alt="Imagem Não de Nem Água"
                 style="display:block; width:100%; max-width:1024px; height:auto; margin:0 auto;">
        </section>

        <!-- MENSAGENS -->
        <section class="informacoes-partida"
                 aria-label="Informações da partida">

            <p id="mensagem" role="status" aria-live="polite">
                Selecione um botão para começar.
            </p>

        </section>

        <footer class="rodape-pagina">
            <p>STADIUM DO COFFEE © 2026</p>
            <span>Que vença o melhor!</span>
        </footer>

    </main>

    <script src="{{ url_for('static', filename='js/jogo.js') }}"></script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Stadium do Coffee - Campeonato de Futebol de Botão">
    <meta name="theme-color" content="#07140f">

    <title>Stadium do Coffee | Futebol de Botão</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <h1>Stadium do Coffee</h1>
        <p>Button Football Championship</p>
    </header>

    <main>

        <!-- PLACAR -->
        <section class="placar" aria-label="Placar da partida">

            <!-- TIME VERMELHO -->
            <div class="time vermelho">
                <h2>Marcos</h2>
                <span id="gols1" aria-label="Gols do time vermelho">0</span>
            </div>

            <!-- TEMPO E TURNO -->
            <div class="centro">
                <h2 id="tempo" aria-label="Tempo de partida">05:00</h2>
                <p id="turno">Vez de Marcos 🔴</p>
            </div>

            <!-- TIME AZUL -->
            <div class="time azul">
                <h2>Marcus</h2>
                <span id="gols2" aria-label="Gols do time azul">0</span>
            </div>

        </section>


        <!-- CAMPO DE FUTEBOL -->
        <section class="campo" aria-label="Campo de futebol de botão">

            <!-- GOL ESQUERDO -->
            <div class="gol gol-topo"></div>

            <!-- MARCAÇÕES DO GRAMADO -->
            <div class="linha-meio"></div>
            <div class="circulo-central"></div>

            <!-- ÁREAS DOS GOLEIROS -->
            <div class="area area-topo"></div>
            <div class="area area-baixo"></div>


            <!-- JOGADORES VERMELHOS -->

            <button
                type="button"
                class="botao vermelho p1"
                aria-label="Jogador vermelho número 1">
                1
            </button>

            <button
                type="button"
                class="botao vermelho p2"
                aria-label="Jogador vermelho número 2">
                2
            </button>

            <button
                type="button"
                class="botao vermelho p3"
                aria-label="Jogador vermelho número 3">
                3
            </button>

            <button
                type="button"
                class="botao vermelho p4"
                aria-label="Jogador vermelho número 4">
                4
            </button>

            <button
                type="button"
                class="botao vermelho p5"
                aria-label="Jogador vermelho número 5">
                5
            </button>


            <!-- BOLA -->
            <div
                class="bola"
                role="img"
                aria-label="Bola do jogo">
            </div>


            <!-- JOGADORES AZUIS -->

            <button
                type="button"
                class="botao azul p6"
                aria-label="Jogador azul número 1">
                1
            </button>

            <button
                type="button"
                class="botao azul p7"
                aria-label="Jogador azul número 2">
                2
            </button>

            <button
                type="button"
                class="botao azul p8"
                aria-label="Jogador azul número 3">
                3
            </button>

            <button
                type="button"
                class="botao azul p9"
                aria-label="Jogador azul número 4">
                4
            </button>

            <button
                type="button"
                class="botao azul p10"
                aria-label="Jogador azul número 5">
                5
            </button>


            <!-- GOL DIREITO -->
            <div class="gol gol-baixo"></div>

        </section>


        <!-- MENSAGENS E INFORMAÇÕES -->
        <section aria-label="Informações da partida">

            <p
                id="mensagem"
                role="status"
                aria-live="polite">
                Selecione um botão para começar.
            </p>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
